<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXT Peças V1.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <header>
        <h1>NXT PEÇAS V1.0</h1>
        <p class="subtitle">SAC - Venda de Peças e Garantia</p>
    </header>

    <main>
        <form id="vendaPecaForm" novalidate>

            <!-- SEÇÃO 1: TIPO DE ATENDIMENTO -->
            <section class="secao-form">
                <h2><span class="secao-icon">📋</span> Atendimento</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Atendimento</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="tipoVenda" value="venda"> Venda de Peça
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="tipoGarantia" value="garantia"> Garantia
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="origemSac">
                            <span class="label-icon">📞</span> Origem SAC
                        </label>
                        <select id="origemSac">
                            <option value="">Selecione...</option>
                            <option value="telefone">Telefone</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="email">E-mail</option>
                            <option value="reclameaqui">Reclame Aqui</option>
                            <option value="procon">Procon</option>
                            <option value="loja">Loja</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="protocoloSac">
                            <span class="label-icon">🔖</span> Protocolo SAC
                        </label>
                        <input type="text" id="protocoloSac" placeholder="Número do protocolo...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-small">
                        <label for="dataVenda">
                            <span class="label-icon">📅</span> Data
                        </label>
                        <input type="date" id="dataVenda" required>
                    </div>
                    <div class="form-group">
                        <label for="vendedor">
                            <span class="label-icon">👤</span> Vendedor (SAC)
                        </label>
                        <input type="text" id="vendedor" required placeholder="Nome do atendente...">
                    </div>
                    <div class="form-group form-group-small">
                        <label for="prevEmbarque">
                            <span class="label-icon">📦</span> Prev. Embarque
                        </label>
                        <input type="date" id="prevEmbarque">
                    </div>
                </div>
            </section>

            <!-- SEÇÃO 2: CLIENTE -->
            <section class="secao-form">
                <h2><span class="secao-icon">👥</span> Cliente</h2>
                <div class="form-row">
                    <div class="form-group form-group-large">
                        <label for="nomeCliente">
                            <span class="label-icon">✏️</span> Nome / Razão Social
                        </label>
                        <input type="text" id="nomeCliente" required placeholder="Nome do cliente...">
                    </div>
                    <div class="form-group form-group-small">
                        <label for="tipoCliente">
                            <span class="label-icon">🏷️</span> Tipo
                        </label>
                        <select id="tipoCliente">
                            <option value="F">Pessoa Física</option>
                            <option value="J">Pessoa Jurídica</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpfCnpjCliente">
                            <span class="label-icon">🪪</span> CPF / CNPJ
                        </label>
                        <input type="text" id="cpfCnpjCliente" placeholder="000.000.000-00" maxlength="18">
                        <div id="avisoDocumento" class="campo-aviso">Documento inválido</div>
                    </div>
                    <div class="form-group">
                        <label for="ieCliente">
                            <span class="label-icon">📄</span> IE <span class="opcional-badge">Opcional</span>
                        </label>
                        <input type="text" id="ieCliente" placeholder="Inscrição Estadual...">
                    </div>
                    <div class="form-group">
                        <label for="telefoneCliente">
                            <span class="label-icon">📱</span> Telefone
                        </label>
                        <input type="tel" id="telefoneCliente" required placeholder="(00) 00000-0000" maxlength="15">
                        <div id="avisoTelefone" class="campo-aviso">Telefone incompleto</div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-large">
                        <label for="enderecoCliente">
                            <span class="label-icon">📍</span> Endereço
                        </label>
                        <input type="text" id="enderecoCliente" placeholder="Rua, número...">
                    </div>
                    <div class="form-group">
                        <label for="bairroCliente">
                            <span class="label-icon">🏘️</span> Bairro
                        </label>
                        <input type="text" id="bairroCliente" placeholder="Bairro...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cidadeCliente">
                            <span class="label-icon">🏙️</span> Cidade
                        </label>
                        <input type="text" id="cidadeCliente" placeholder="Cidade...">
                    </div>
                    <div class="form-group form-group-small">
                        <label for="ufCliente">
                            <span class="label-icon">🗺️</span> UF
                        </label>
                        <select id="ufCliente">
                            <option value="">UF</option>
                            <option value="AC">AC</option><option value="AL">AL</option>
                            <option value="AP">AP</option><option value="AM">AM</option>
                            <option value="BA">BA</option><option value="CE">CE</option>
                            <option value="DF">DF</option><option value="ES">ES</option>
                            <option value="GO">GO</option><option value="MA">MA</option>
                            <option value="MT">MT</option><option value="MS">MS</option>
                            <option value="MG">MG</option><option value="PA">PA</option>
                            <option value="PB">PB</option><option value="PR">PR</option>
                            <option value="PE">PE</option><option value="PI">PI</option>
                            <option value="RJ">RJ</option><option value="RN">RN</option>
                            <option value="RS">RS</option><option value="RO">RO</option>
                            <option value="RR">RR</option><option value="SC">SC</option>
                            <option value="SP">SP</option><option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                    <div class="form-group form-group-small">
                        <label for="cepCliente">
                            <span class="label-icon">📮</span> CEP
                        </label>
                        <input type="text" id="cepCliente" placeholder="00000-000" maxlength="9">
                    </div>
                </div>
            </section>

            <!-- SEÇÃO 3: PEÇAS -->
            <section class="secao-form">
                <h2><span class="secao-icon">🔧</span> Peças</h2>

                <div class="adicionar-peca-box">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoriaPeca">
                                <span class="label-icon">📂</span> Categoria
                            </label>
                            <select id="categoriaPeca" onchange="filtrarPecas()">
                                <option value="">Selecione a categoria...</option>
                            </select>
                        </div>
                        <div class="form-group form-group-large">
                            <label for="descricaoPeca">
                                <span class="label-icon">📦</span> Peça
                            </label>
                            <select id="descricaoPeca" onchange="preencherPreco()">
                                <option value="">Selecione a peça...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="modeloMoto">
                                <span class="label-icon">🏍️</span> Modelo da Moto
                            </label>
                            <select id="modeloMoto">
                                <option value="">Selecione o modelo...</option>
                            </select>
                        </div>
                        <div class="form-group form-group-small">
                            <label for="tipoPrecoPeca">
                                <span class="label-icon">🏷️</span> Tipo Preço
                            </label>
                            <select id="tipoPrecoPeca" onchange="preencherPreco()">
                                <option value="cliente">Cliente Final</option>
                                <option value="revenda">Revenda</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group form-group-small">
                            <label for="qtdPeca">
                                <span class="label-icon">🔢</span> Qtd
                            </label>
                            <input type="number" id="qtdPeca" min="1" value="1" placeholder="1">
                        </div>
                        <div class="form-group form-group-small">
                            <label for="precoPeca">
                                <span class="label-icon">💲</span> Preço Unit. (R$)
                            </label>
                            <input type="text" id="precoPeca" placeholder="0,00" class="mask-moeda">
                        </div>
                        <div class="form-group form-group-small">
                            <label>Subtotal</label>
                            <div class="subtotal-display" id="subtotalPeca">R$ 0,00</div>
                        </div>
                    </div>
                    <button type="button" class="btn-adicionar-peca" onclick="adicionarPeca()">
                        <span>➕</span> Adicionar Peça
                    </button>
                </div>

                <div id="listaPecas" class="lista-pecas"></div>

                <div class="total-bar">
                    <span>Total Peças:</span>
                    <span id="totalVenda">R$ 0,00</span>
                </div>
            </section>

            <!-- SEÇÃO 4: FRETE -->
            <section class="secao-form">
                <h2><span class="secao-icon">🚚</span> Frete</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="transportadora">
                            <span class="label-icon">🏢</span> Transportadora
                        </label>
                        <select id="transportadora">
                            <option value="">Selecione...</option>
                            <option value="correios">Correios</option>
                            <option value="rodonaves">Rodonaves</option>
                            <option value="em_maos">Em Mãos</option>
                            <option value="loja">Loja</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group form-group-small">
                        <label for="valorFrete">
                            <span class="label-icon">💲</span> Valor Frete (R$)
                        </label>
                        <input type="text" id="valorFrete" placeholder="0,00" class="mask-moeda">
                    </div>
                </div>
            </section>

            <!-- SEÇÃO 5: PAGAMENTO -->
            <section class="secao-form">
                <h2><span class="secao-icon">💳</span> Pagamento</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="formaPagamento">
                            <span class="label-icon">💰</span> Forma de Pagamento
                        </label>
                        <select id="formaPagamento" required>
                            <option value="">Selecione...</option>
                            <option value="dinheiro">Dinheiro</option>
                            <option value="pix">PIX</option>
                            <option value="debito">Cartão Débito</option>
                            <option value="credito">Cartão Crédito</option>
                            <option value="boleto">Boleto</option>
                            <option value="link">Link de Pagamento</option>
                            <option value="transferencia">Transferência</option>
                        </select>
                    </div>
                    <div class="form-group form-group-small" id="parcelasContainer" style="display:none;">
                        <label for="parcelas">
                            <span class="label-icon">📊</span> Parcelas
                        </label>
                        <select id="parcelas">
                            <option value="1">1x</option>
                            <option value="2">2x</option>
                            <option value="3">3x</option>
                            <option value="4">4x</option>
                            <option value="5">5x</option>
                            <option value="6">6x</option>
                            <option value="7">7x</option>
                            <option value="8">8x</option>
                            <option value="9">9x</option>
                            <option value="10">10x</option>
                            <option value="11">11x</option>
                            <option value="12">12x</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="observacoes">
                            <span class="label-icon">📝</span> Observações <span class="opcional-badge">Opcional</span>
                        </label>
                        <textarea id="observacoes" rows="2" placeholder="Alguma observação..."></textarea>
                    </div>
                </div>

                <div class="total-bar total-bar-final">
                    <span>TOTAL GERAL (Peças + Frete):</span>
                    <span id="totalGeral">R$ 0,00</span>
                </div>
            </section>

            <!-- BOTÃO REGISTRAR -->
            <button type="submit" class="btn-registrar-venda">
                <span class="btn-icon">✅</span> Registrar Atendimento
            </button>

        </form>
    </main>

    <!-- MODAL RESUMO -->
    <div id="resumoModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3>Atendimento Registrado!</h3>
            <div class="checklist-resumo">
                <div class="checklist-item" id="checkPlanilha">
                    <span class="checklist-icon">⏳</span>
                    <span>Enviando para planilha...</span>
                </div>
                <div class="checklist-item" id="checkBling">
                    <span class="checklist-icon">⏳</span>
                    <span>Enviando para Bling...</span>
                </div>
            </div>
            <textarea id="textoResumoModal" class="resumo-textarea" rows="12" readonly></textarea>
            <div class="modal-actions">
                <button type="button" class="btn-copiar" onclick="copiarResumo()">
                    📋 Copiar Resumo
                </button>
                <button type="button" class="btn-nova-venda" onclick="novaVenda()">
                    🔄 Novo Atendimento
                </button>
            </div>
        </div>
    </div>

    <!-- FEEDBACK TOAST -->
    <div id="feedbackToast" class="feedback-toast"></div>

    <script src="script.js"></script>
</body>
</html>
